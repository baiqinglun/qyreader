<!DOCTYPE html>
<!--
  QYReader 正文渲染页（自托管 epub.js）。

  桥协议（JSON，经 flutter_inappwebview callHandler 'readerEvent' 上行）：
    JS → Dart: ready / locationsReady / relocated / error / tap
    Dart → JS（evaluateJavascript 全局函数）:
      loadBook(base64) → initReader(styleJson, locatorJson|null)
        → applyStyle(styleJson) / gotoLocator(locatorJson) / gotoHref(href)
        → gotoPercent(p) / nextPage() / prevPage() / syncNext(locatorJson)

  注意：
  - 文本选择在 M2 标注功能接入前禁用（user-select none）。
  - 翻页手势由原生接管，本页不做滑动翻页，只接受 nextPage/prevPage 指令。
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script src="jszip.min.js"></script>
  <script src="epub.min.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    #viewer { width: 100%; height: 100%; }
  </style>
</head>
<body>
<div id="viewer"></div>
<script>
  'use strict';
  var book = null;
  var rendition = null;
  var currentStyle = null;
  var locationsTotal = 0;

  // ---- 事件通道（三路并发 + 序号去重）：
  // ---- 实测 Windows WebView2 只送 console.error 不送 console.log；
  // ---- Android callHandler 与 console 均可用。三路齐发，Dart 按 __n 去重。
  var __errs = [];
  var __seq = 0;

  function post(msg) {
    msg.__n = ++__seq;
    var j = JSON.stringify(msg);
    try { console.error('QYEVT:' + j); } catch (e) {}
    try { console.log('QYEVT:' + j); } catch (e) {}
    try {
      if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
        window.flutter_inappwebview.callHandler('readerEvent', j);
      }
    } catch (e) {}
  }

  // 未捕获 JS 错误：既上报也留存在 __errs 供 __diagDump 拉取
  window.addEventListener('error', function (e) {
    var text = e.message + ' @' + e.filename + ':' + e.lineno;
    __errs.push(text);
    console.error('QYERR:' + text);
    post({ type: 'error', code: 'js.uncaught', message: text });
  });
  window.addEventListener('unhandledrejection', function (e) {
    var text = e.reason && e.reason.message ? e.reason.message : String(e.reason);
    __errs.push('promise: ' + text);
    console.error('QYERR:' + text);
  });

  /// Dart 诊断拉取：返回页面内错误与桥状态（evaluateJavascript 直接取返回值）。
  window.__diagDump = function () {
    return JSON.stringify({
      errs: __errs,
      hasBridge: !!(window.flutter_inappwebview && window.flutter_inappwebview.callHandler),
      hasBook: !!window.book,
      hasRendition: !!window.rendition
    });
  };

  function postError(code, message) {
    post({ type: 'error', code: code, message: String(message) });
  }

  /// 从 relocated 事件构造 Locator JSON（CFI 主定位 + 章索引兜底 + percent 展示）。
  function makeLocator(location) {
    var loc = { v: 1 };
    try {
      loc.cfi = location.start.cfi;
      loc.href = location.start.href;
      var spineItem = book.spine.get(location.start.href);
      if (spineItem) loc.chapterIndex = spineItem.index;
      if (book.locations && locationsTotal > 0) {
        var p = book.locations.percentageFromCfi(location.start.cfi);
        if (p !== null && !isNaN(p)) loc.percent = p;
      }
    } catch (e) {
      postError('locator.build', e);
    }
    return loc;
  }

  function themeCss(style) {
    var t = style.theme;
    return {
      'html': { 'background': t.background },
      'body': {
        'background': t.background,
        'color': t.foreground,
        'padding': '0 ' + style.margin + 'px !important',
        'line-height': String(style.lineHeight) + ' !important',
        'font-size': style.fontSize + 'px !important'
      },
      'p': {
        'line-height': String(style.lineHeight) + ' !important'
      },
      'a': { 'color': t.accent },
      '::selection': { 'background': t.accent }
    };
  }

  function applyStyleToRendition(style) {
    currentStyle = style;
    if (!rendition) return;
    try {
      rendition.themes.register('reader', themeCss(style));
      rendition.themes.select('reader');
    } catch (e) {
      postError('style.apply', e);
    }
  }

  /// Dart → JS：载入书籍并渲染。
  /// bookUrl 为本地资源服务（127.0.0.1）上的书籍地址，epub.js 同源拉取；
  /// locatorJson 可空；非空时首次 display 直接定位（JS 自主首渲，
  /// 不依赖 Dart 二次指令，规避桥时序问题）。
  async function loadBook(bookUrl, locatorJson) {
    try {
      book = ePub(bookUrl);
      rendition = book.renderTo('viewer', {
        width: '100%',
        height: '100%',
        flow: 'paginated',
        spread: 'none',
        // FIXME: 需核对文档——minSpreadWidth 大值强制单页排版，窄屏本就单页。
        minSpreadWidth: 100000,
        allowScriptedContent: false
      });
      rendition.on('relocated', function (location) {
        post({
          type: 'relocated',
          locator: makeLocator(location),
          atStart: location.atStart === true,
          atEnd: location.atEnd === true
        });
      });
      rendition.on('displayError', function (e) {
        postError('render.display', e);
      });
      // 三分点 tap 上报（原生负责翻页决策）
      rendition.on('tap', function (e) {
        post({ type: 'tap', x: e.clientX, y: e.clientY });
        return false;
      });
      // 桌面鼠标路径兜底：epub.js tap 依赖触摸事件，WebView2 上不触发，
      // 直接在 iframe 文档挂 click（坐标换算到外层视口）。
      // FIXME: 需核对文档——view.document/view.iframe 为 epub.js 内部结构。
      rendition.on('rendered', function (section, view) {
        var doc = view && view.document;
        var iframe = view && view.iframe;
        if (!doc || !iframe) return;
        doc.addEventListener('click', function (e) {
          var r = iframe.getBoundingClientRect();
          post({ type: 'tap', x: e.clientX + r.left, y: e.clientY + r.top });
        });
      });
      var initial = null;
      try { initial = locatorJson ? JSON.parse(locatorJson) : null; } catch (e) { initial = null; }
      book.ready.then(function () {
        // locations 用于百分比与进度条，异步生成不阻塞阅读
        book.locations.generate(1600).then(function (locations) {
          // generate() 返回 location CFI 数组
          locationsTotal = locations.length;
          post({ type: 'locationsReady', total: locations.length });
          // percent 在首屏 relocated 时（locations 未就绪）为空，这里重报一次
          reportLocation();
        }).catch(function (e) { postError('locations.generate', e); });
        return initial
          ? rendition.display(initial.cfi || initial.href || initial.percent || undefined)
          : rendition.display();
      }).then(function () {
        post({ type: 'ready' });
      }).catch(function (e) { postError('book.ready', e); });
    } catch (e) {
      postError('book.open', e);
    }
  }

  /// 样式注入（含初始主题色）。
  function initReader(styleJson) {
    applyStyleToRendition(JSON.parse(styleJson));
  }

  function applyStyle(styleJson) {
    applyStyleToRendition(JSON.parse(styleJson));
  }

  function gotoLocator(locatorJson) {
    if (!rendition) return;
    try {
      var loc = JSON.parse(locatorJson);
      if (loc.cfi) {
        rendition.display(loc.cfi).catch(function () {
          if (loc.percent != null) {
            rendition.display(loc.percent).catch(function (e2) {
              postError('goto.fallback', e2);
            });
          } else if (loc.href) {
            rendition.display(loc.href).catch(function (e3) {
              postError('goto.fallback', e3);
            });
          }
        });
      } else if (loc.percent != null) {
        rendition.display(loc.percent);
      } else if (loc.href) {
        rendition.display(loc.href);
      } else {
        rendition.display();
      }
    } catch (e) {
      postError('goto.parse', e);
    }
  }

  function gotoHref(href) {
    if (!rendition) return;
    rendition.display(href);
  }

  function gotoPercent(p) {
    if (!rendition) return;
    rendition.display(p);
  }

  /// 重报当前位置（locations 就绪后补 percent 用）。
  /// currentLocation() 同步返回 location 对象（部分版本可能包 Promise，兼容处理）。
  function reportLocation() {
    if (!rendition) return;
    var handle = function (loc) {
      if (loc && loc.start) {
        post({
          type: 'relocated',
          locator: makeLocator(loc),
          atStart: loc.atStart === true,
          atEnd: loc.atEnd === true
        });
      }
    };
    try {
      var loc = rendition.currentLocation();
      if (loc && typeof loc.then === 'function') {
        loc.then(handle).catch(function (e) { postError('report.location', e); });
      } else {
        handle(loc);
      }
    } catch (e) {
      postError('report.location', e);
    }
  }

  function nextPage() {
    if (!rendition) return;
    rendition.next();
  }

  function prevPage() {
    if (!rendition) return;
    rendition.prev();
  }

  /// 与目标位置对齐后前进一页（reserve 池同步用）。
  function syncNext(locatorJson) {
    if (!rendition) return;
    var loc = null;
    try { loc = locatorJson ? JSON.parse(locatorJson) : null; } catch (e) { loc = null; }
    var aligned = (loc && (loc.cfi || loc.href || loc.percent != null))
      ? rendition.display(loc.cfi || loc.href || loc.percent)
      : rendition.display();
    aligned.then(function () { rendition.next(); }).catch(function () {
      rendition.display();
    });
  }

  post({ type: 'bridgeReady' });
</script>
</body>
</html>
