name: qy_reader
description: "QYReader：本地优先的跨平台阅读 App（书架 / 划线 / TTS / S3 同步）。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^17.0.0
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.42
  freezed_annotation: ^3.0.0
  file_picker: ^11.0.3
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.6.0
  crypto: ^3.0.8
  archive: ^4.6.0
  xml: ^6.6.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.28.0
  freezed: ^3.0.0
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true
